# AeroNode decision rules.
# Thresholds live here so they can be tuned without touching code.
# The engine reloads this file on startup (and via POST /config/reload).

home:
  lat: 17.4474
  lon: 78.3762

battery:
  warn_below: 35          # % - warning only
  rtl_below: 25           # % - return to launch
  land_below: 12          # % - land immediately, wherever we are

predictive_battery:
  enabled: true
  reserve_pct: 10         # battery we want left after reaching home
  safety_factor: 1.3      # trigger RTL when time-to-reserve < 1.3 x time-to-home
  window_s: 60            # regression window for the drain rate
  min_samples: 15
  cruise_speed: 8.0       # m/s, used to estimate time-to-home
  descent_rate: 2.5       # m/s

geofence:
  radius_m: 1000          # circular fence around home
  warn_ratio: 0.85        # warn when beyond 85% of the radius

altitude:
  max_m: 120              # regulatory ceiling -> DESCEND

motor_temp:
  warn_above: 70          # deg C
  land_above: 85          # deg C -> LAND

signal:
  warn_below: 30          # % link quality

proximity:
  horizontal_m: 30        # conflict if closer than this horizontally...
  vertical_m: 12          # ...and this vertically
  clear_factor: 2.0       # conflict cleared once separation > 2x the limits
  resume_after_s: 8       # held drone resumes after this long in the clear

anomaly:
  metrics: [alt, motor_temp, battery]
  window: 30              # rolling residuals per drone per metric
  min_samples: 10         # learn before judging
  z_threshold: 5.0        # residual must exceed 5 std...
  min_residual:           # ...and at least this much (units of the metric)
    alt: 10.0
    motor_temp: 6.0
    battery: 4.0
  confirm_shift:          # consistent off-trend readings needed to accept a real level shift
    battery: 3            # a cell can genuinely drop out between two frames
    alt: 15               # altitude and temperature can't jump physically:
    motor_temp: 15        # only a long, consistent run re-baselines them

recovery:
  trigger_count: 4        # glitchy frames within trigger_window_s start recovery
  trigger_window_s: 10
  verify_s: 12            # time to wait before judging a recovery step
  healthy_streak: 10      # clean frames that count as "recovered"
  ladder: [RESET_SENSOR, REBOOT]   # then fall back to RTL
  reboot_grace_s: 10      # a reboot we ordered is an expected outage, not LINK_LOST

watchdog:
  link_timeout_s: 5       # no telemetry for this long -> LINK_LOST
  check_interval_s: 1

decisions:
  cooldown_s: 20          # same rule on same drone won't re-fire faster than this
  resend_after_s: 10      # re-send a command if the drone hasn't complied
