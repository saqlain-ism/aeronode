name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r engine/requirements-dev.txt -r simulator/requirements.txt ruff
      - name: Lint
        run: ruff check engine simulator scripts
      - name: Engine tests
        working-directory: engine
        run: python -m pytest -q
      - name: Simulator tests
        working-directory: simulator
        run: python -m pytest -q
      - name: Dashboard is up to date
        run: python scripts/build_dashboard.py && git diff --exit-code grafana/dashboards

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: cp .env.example .env && docker compose config --quiet
      - name: Build images
        run: docker compose build engine simulator
